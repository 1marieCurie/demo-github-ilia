
name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pytest
        run: pip install pytest

      - name: Executer les tests
        run: pytest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generer la page HTML
        run: |
          python build.py
          mkdir site
          mv index.html site/index.html

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
